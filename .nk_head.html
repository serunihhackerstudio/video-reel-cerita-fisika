<!--@TITLE Kenapa bom nuklir bisa menghasilkan daya ledak yang luar biasa?-->
<!--@RASIO 16:9-->
<!--@HEAD-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600;700&family=Sora:wght@500;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
#stage{background:#04050c}
#gl{position:absolute;left:0;top:0;display:block}
.ov{position:absolute;z-index:6;opacity:0;visibility:hidden;color:#F3EEE8;isolation:isolate;text-shadow:0 3px 4px rgba(3,4,10,.9),0 0 30px rgba(3,4,10,.8)}
.ov:before{content:'';position:absolute;inset:-70px -110px;z-index:-1;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(3,4,10,.55),rgba(3,4,10,0))}
.ov small{display:block;font:500 28px/1.2 'Sora',sans-serif;letter-spacing:.14em;color:#C9C6DA;text-transform:uppercase}
.ov b{display:block;margin-top:8px;font:600 92px/1.05 'Cormorant Garamond',serif}
.ov b i{font-style:italic;color:#FFB878}
.selubung{position:absolute;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(3,4,10,.6),rgba(3,4,10,0) 100%)}

.ov .row{margin-bottom:30px}.ov .trk{margin-top:12px;height:26px;border-radius:13px;background:rgba(150,165,230,.16);overflow:hidden}
.ov .trk i{display:block;height:100%;width:0;border-radius:13px;background:linear-gradient(90deg,#c86a3a,#ffb070);font-style:normal}
.ov .trk i.vi{background:linear-gradient(90deg,#7a6bff,#ffd9a0);box-shadow:0 0 18px #8f7bff}
#gelap{position:absolute;inset:0;background:#03040a;opacity:0;pointer-events:none;z-index:9}
</style>
<!--@BODY-->
<div class="selubung" id="vSub"></div>
<div id="gelap"></div>
<!--@SCRIPT-->
